
name: Build Monici Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Monici APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'

      - name: Generate missing Gradle Wrapper
        shell: bash
        run: |
          set -e
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          gradle -p android wrapper --gradle-version 8.14.6 --distribution-type all
          chmod +x android/gradlew
          test -s android/gradle/wrapper/gradle-wrapper.jar
          test -x android/gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Monici-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
